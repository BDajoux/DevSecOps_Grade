name: wpscan

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  wpscan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start WordPress
        run: docker compose -f docker/docker-compose.yml up -d

      - name: Wait for WordPress
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/wp-admin/install.php >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "WordPress not ready" >&2
          docker compose -f docker/docker-compose.yml ps
          exit 1

      - name: Run WPScan
        env:
          WPSCAN_API_TOKEN: ${{ secrets.WPSCAN_API_TOKEN }}
        run: |
          TOKEN_ARG=""
          if [ -n "$WPSCAN_API_TOKEN" ]; then
            TOKEN_ARG="--api-token $WPSCAN_API_TOKEN"
          fi
          docker run --rm --network host wpscanteam/wpscan \
            --url http://localhost:8080 \
            --format json \
            $TOKEN_ARG \
            --output wpscan-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: wpscan-report
          path: wpscan-report.json

      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
