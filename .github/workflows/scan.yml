on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read
 
jobs: 
  wordpress-wpscan: 
    runs-on: ubuntu-latest 
 
    steps: 
      - name: Checkout (required even if no repo code is used) 
        uses: actions/checkout@v4 
 
      - name: Set up Docker environment 
        run: | 
          sudo systemctl start docker 
          docker version 

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Start docker
        run: docker compose -f docker/docker-compose.yml up -d

      - name: Wait for WordPress
        run: |
          last_code=""
          for i in {1..30}; do
            last_code=$(curl -s --max-time 3 -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            echo "Attempt $i: status $last_code"
            if [ "$last_code" = "200" ] || [ "$last_code" = "301" ] || [ "$last_code" = "302" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "WordPress not ready (last status: $last_code)" >&2
          docker compose -f docker/docker-compose.yml ps
          docker compose -f docker/docker-compose.yml logs --no-color --tail 200 wordpress || true
          exit 1

      - name: Install WordPress (if needed)
        run: |
          WPSCAN_USERNAME="admin"
          WPSCAN_PASSWORD="admin"
          WPSCAN_EMAIL="admin@admin.com"
          if curl -fsS http://localhost:8080/wp-admin/install.php | grep -q "Already Installed"; then
            exit 0
          fi
          curl -fsS -X POST "http://localhost:8080/wp-admin/install.php?step=2" \
            -d "weblog_title=WPScan+Lab" \
            -d "user_name=$WPSCAN_USERNAME" \
            -d "admin_password=$WPSCAN_PASSWORD" \
            -d "admin_password2=$WPSCAN_PASSWORD" \
            -d "admin_email=$WPSCAN_EMAIL" \
            -d "blog_public=0" >/dev/null
 
      - name: Install Ruby and WPScan 
        run: | 
          sudo apt-get update 
          sudo apt-get install -y ruby-full build-essential libcurl4-openssl-dev zlib1g-dev 
          sudo gem install wpscan 
 
      - name: Run WPScan 
        run: | 
          mkdir -p scans
          wpscan --url http://localhost:8080 --api-token "i90aaKfnfRR57JTpfI4xcmAnB8Cc4n9nHWTnjDtZGdY" --enumerate u,vp,vt --force --format json --output scans/wpscan-report.json || true

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: wpscan-report
          path: scans/wpscan-report.json