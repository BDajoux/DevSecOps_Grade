on: 
  push: 
    branches: 
      - main 
 
jobs: 
  wordpress-wpscan: 
    runs-on: ubuntu-latest 
 
    steps: 
      - name: Checkout (required even if no repo code is used) 
        uses: actions/checkout@v4 
 
      - name: Set up Docker environment 
        run: | 
          sudo systemctl start docker 
          docker version 
 
      - name: Start docker
        run: docker compose -f docker/docker-compose.yml up -d
 
      - name: Install Ruby and WPScan 
        run: | 
          sudo apt-get update 
          sudo apt-get install -y ruby-full build-essential libcurl4-openssl-dev zlib1g-dev 
          sudo gem install wpscan 
 
      - name: Run WPScan 
        run: | 
          wpscan --url http://localhost:8080 --enumerate u,vp,vt --force || true 